name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SubscriptionManager.slnx

      - name: Verify formatting
        run: dotnet format SubscriptionManager.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SubscriptionManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SubscriptionManager.slnx --configuration Release --no-build
