name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SubscriptionManager.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish API
        run: >
          dotnet publish
          src/SubscriptionManager.Api/SubscriptionManager.Api.csproj
          --configuration Release
          --no-restore
          --output artifacts/api

      - name: Publish Web
        run: >
          dotnet publish
          src/SubscriptionManager.Web/SubscriptionManager.Web.csproj
          --configuration Release
          --no-restore
          --output artifacts/web

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sync secrets to Key Vault
        env:
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          az keyvault secret set \
            --vault-name kv-submanager-prod \
            --name jwt-signing-key \
            --value "$JWT_SIGNING_KEY" \
            --output none

          az keyvault secret set \
            --vault-name kv-submanager-prod \
            --name openai-api-key \
            --value "$OPENAI_API_KEY" \
            --output none

          az keyvault secret set \
            --vault-name kv-submanager-prod \
            --name stripe-secret-key \
            --value "$STRIPE_SECRET_KEY" \
            --output none

          az keyvault secret set \
            --vault-name kv-submanager-prod \
            --name stripe-webhook-secret \
            --value "$STRIPE_WEBHOOK_SECRET" \
            --output none

      - name: Apply database migrations
        env:
          ConnectionStrings__SubscriptionManager: "Server=tcp:sql-subscription-manager-prod.database.windows.net,1433;Database=sqldb-subscription-manager-prod;Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;"
        run: >
          dotnet ef database update
          --project src/SubscriptionManager.Infrastructure/SubscriptionManager.Infrastructure.csproj
          --startup-project src/SubscriptionManager.Api/SubscriptionManager.Api.csproj
          --configuration Release
          --no-build

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-subscription-manager-api-prod
          package: artifacts/api

      - name: Deploy Web
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-subscription-manager-web-prod
          package: artifacts/web
